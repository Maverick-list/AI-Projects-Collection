{% extends "layout.html" %}

{% block title %}Kirim Tugas{% endblock %}
{% block header_title %}Kirim Tugas{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
    <h4 class="text-lg font-bold text-gray-800 mb-6">Kirim Tugas Baru</h4>
    <form>
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">Judul Tugas</label>
            <input type="text"
                class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition"
                placeholder="Contoh: Latihan Fiqih Bab 1">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">Kelas</label>
            <select
                class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition">
                <option>X IPA 1</option>
                <option>XI IPS 2</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-bold text-gray-700 mb-2">Deskripsi</label>
            <textarea
                class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none transition"
                rows="4"></textarea>
        </div>
        <button type="submit"
            class="bg-madrasah text-white px-6 py-2 rounded-xl font-bold hover:bg-green-800 transition">Kirim
            Tugas</button>
    </form>
</div>
{% endblock %}
