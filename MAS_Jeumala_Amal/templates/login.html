{% extends "layout.html" %}

{% block no_auth_content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4 sm:p-8 lg:p-12">
    <div
        class="bg-white p-6 sm:p-10 md:p-16 rounded-3xl shadow-2xl w-full max-w-xl lg:max-w-2xl transition-all duration-300 transform">
        <div class="flex flex-col items-center mb-12">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}"
                class="w-24 h-24 rounded-full mb-6 shadow-md object-cover ring-4 ring-gray-50" alt="Logo">
            <h2 class="text-3xl font-extrabold text-gray-800 tracking-tight">Login {{ 'Guru' if role == 'guru' else
                'Murid' }}</h2>
            <p class="text-gray-500 text-base mt-2">Selamat datang kembali! Silakan masuk ke akun anda.</p>
        </div>

        <form method="POST" class="space-y-8">
            <div class="group">
                <label
                    class="block text-sm font-bold text-gray-700 mb-2 transition-colors group-focus-within:text-green-600">Username</label>
                <div class="relative">
                    <input type="text" name="username"
                        class="w-full px-6 py-4 rounded-2xl border-2 border-gray-100 focus:border-green-500 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-green-50/50 outline-none transition-all text-gray-800"
                        placeholder="Masukkan username anda" required>
                </div>
            </div>
            <div class="group">
                <label
                    class="block text-sm font-bold text-gray-700 mb-2 transition-colors group-focus-within:text-green-600">Password</label>
                <div class="relative">
                    <input type="password" name="password"
                        class="w-full px-6 py-4 rounded-2xl border-2 border-gray-100 focus:border-green-500 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-green-50/50 outline-none transition-all text-gray-800"
                        placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit"
                class="w-full {{ 'bg-amber-600 hover:bg-amber-700 shadow-amber-200' if role == 'guru' else 'bg-green-600 hover:bg-green-700 shadow-green-200' }} text-white py-5 rounded-2xl font-bold text-lg shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2">
                <span>Masuk Sekarang</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </button>
        </form>

        <div class="mt-10 pt-8 border-t border-gray-100">
            <a href="{{ url_for('landing') }}"
                class="flex items-center justify-center gap-2 text-gray-400 hover:text-gray-600 transition-colors py-2 group">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-4 w-4 transform group-hover:-translate-x-1 transition-transform" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span class="text-sm font-medium">Kembali ke Halaman Utama</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
